# The save-me-as-AI-Sponsor flow is a QR, a link and a file that all have to
# agree. Any one can break while the page still looks perfect, and the only
# person who would find out is somebody who scans it, gets nothing, and does not
# tell us. So this checks the live site every day and after every change to it.
name: Contact card still works

on:
  schedule:
    - cron: '17 7 * * *'
  push:
    paths:
      - 'aisponsor.vcf'
      - 'ai-sponsor-registration.html'
      - '.github/workflows/contact-card.yml'
      - '.github/scripts/check_contact_card.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: pip install --quiet zxing-cpp pillow vobject

      # On a push the check races GitHub Pages, which takes a few minutes and is
      # cancelled outright if another commit lands first. Failing on that would
      # paint the run red on every deploy, and a check that cries wolf is one
      # people stop reading, which is worse than not having it. So retry through
      # the deploy window and only report the state it settles on.
      #
      # The daily run passes on the first attempt: nothing is deploying then.
      - name: Check the live contact card
        run: |
          for attempt in $(seq 1 12); do
            if python .github/scripts/check_contact_card.py; then
              echo "settled after $attempt attempt(s)"
              exit 0
            fi
            echo "attempt $attempt did not pass, the deploy may still be landing"
            sleep 30
          done
          echo "::error::the contact card is still broken after 6 minutes of retries"
          python .github/scripts/check_contact_card.py
          exit 1
